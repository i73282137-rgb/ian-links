<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#050706" />
    <meta name="description" content="Todos os links da Web_Up em um só lugar." />
    <meta property="og:title" content="Web_Up | Links" />
    <meta
      property="og:description"
      content="Conteúdo, projetos e contato — escolha seu próximo clique."
    />
    <meta property="og:type" content="website" />
    <title>Web_Up | Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --acid: #b6ff3b;
        --acid-soft: #7fbf18;
        --black: #050706;
        --panel: rgba(13, 17, 14, 0.76);
        --white: #f3f7f1;
        --muted: #98a399;
        --line: rgba(182, 255, 59, 0.17);
      }
      * {
        box-sizing: border-box;
      }
      html {
        min-height: 100%;
        background: var(--black);
      }
      body {
        min-height: 100vh;
        margin: 0;
        color: var(--white);
        font-family: "DM Sans", sans-serif;
        overflow-x: hidden;
        background:
          radial-gradient(
            circle at 50% -15%,
            rgba(182, 255, 59, 0.17),
            transparent 40%
          ),
          radial-gradient(
            circle at 90% 85%,
            rgba(72, 255, 118, 0.07),
            transparent 28%
          ),
          var(--black);
      }
      body:before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.38;
        background-image:
          linear-gradient(rgba(182, 255, 59, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(182, 255, 59, 0.035) 1px, transparent 1px);
        background-size: 34px 34px;
        mask-image: linear-gradient(to bottom, #000, transparent 82%);
        animation: grid-drift 18s linear infinite;
      }
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.2;
        pointer-events: none;
      }
      .orb.one {
        width: 230px;
        height: 230px;
        background: var(--acid);
        top: -110px;
        left: -100px;
        animation: float 10s ease-in-out infinite;
      }
      .orb.two {
        width: 180px;
        height: 180px;
        background: #00ff84;
        right: -100px;
        bottom: 7%;
        animation: float 13s ease-in-out infinite reverse;
      }
      .shell {
        width: min(100% - 32px, 520px);
        margin: 0 auto;
        padding: 54px 0 40px;
        position: relative;
        z-index: 1;
      }
      .profile {
        text-align: center;
        margin-bottom: 30px;
        animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .avatar-wrap {
        width: 108px;
        height: 108px;
        margin: 0 auto 20px;
        position: relative;
      }
      .avatar-wrap:before {
        content: "";
        position: absolute;
        inset: -6px;
        border: 1px solid rgba(182, 255, 59, 0.55);
        border-radius: 32px;
        transform: rotate(8deg);
        animation: halo 5s ease-in-out infinite;
      }
      .avatar {
        height: 100%;
        display: grid;
        place-items: center;
        border-radius: 28px;
        color: var(--black);
        background: var(--acid);
        font: 700 34px/1 "Space Grotesk";
        box-shadow: 0 0 44px rgba(182, 255, 59, 0.22);
        transform: rotate(-3deg);
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        padding: 7px 11px;
        border: 1px solid var(--line);
        border-radius: 999px;
        color: var(--acid);
        background: rgba(182, 255, 59, 0.05);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      .status:before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--acid);
        box-shadow: 0 0 12px var(--acid);
        animation: pulse 2s infinite;
      }
      h1 {
        margin: 0;
        font: 700 clamp(38px, 11vw, 56px) / 0.95 "Space Grotesk";
        letter-spacing: -0.055em;
      }
      h1 span {
        color: var(--acid);
      }
      .links {
        display: grid;
        gap: 12px;
      }
      .link-card {
        --x: 50%;
        --y: 50%;
        position: relative;
        display: grid;
        grid-template-columns: 48px 1fr 24px;
        align-items: center;
        gap: 14px;
        width: 100%;
        min-height: 82px;
        padding: 15px 18px;
        overflow: hidden;
        color: inherit;
        text-align: left;
        text-decoration: none;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--panel);
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        opacity: 0;
        transform: translateY(20px);
        animation: card-in 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        transition:
          border-color 0.25s,
          transform 0.25s,
          background 0.25s;
      }
      .link-card:before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0;
        background: radial-gradient(
          200px circle at var(--x) var(--y),
          rgba(182, 255, 59, 0.16),
          transparent 60%
        );
        transition: opacity 0.25s;
      }
      .link-card:hover {
        transform: translateY(-3px);
        border-color: rgba(182, 255, 59, 0.52);
        background: rgba(18, 25, 19, 0.91);
      }
      .link-card:hover:before {
        opacity: 1;
      }
      .link-card:nth-child(1) {
        animation-delay: 0.15s;
      }
      .link-card:nth-child(2) {
        animation-delay: 0.24s;
      }
      .link-card:nth-child(3) {
        animation-delay: 0.33s;
      }
      .link-card:nth-child(4) {
        animation-delay: 0.42s;
      }
      .icon {
        position: relative;
        z-index: 1;
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border-radius: 15px;
        color: var(--acid);
        background: rgba(182, 255, 59, 0.09);
        border: 1px solid rgba(182, 255, 59, 0.15);
      }
      .icon svg,
      .arrow svg {
        width: 22px;
        height: 22px;
      }
      .copy {
        position: relative;
        z-index: 1;
        min-width: 0;
      }
      .copy strong {
        display: block;
        font: 600 16px/1.2 "Space Grotesk";
      }
      .copy small {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
      }
      .arrow {
        position: relative;
        z-index: 1;
        color: var(--acid);
        transition: transform 0.25s;
      }
      .link-card:hover .arrow {
        transform: translate(3px, -3px);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
      }
      @keyframes card-in {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes pulse {
        50% {
          opacity: 0.35;
          transform: scale(0.75);
        }
      }
      @keyframes halo {
        50% {
          transform: rotate(-5deg) scale(1.03);
        }
      }
      @keyframes float {
        50% {
          transform: translate(25px, 30px) scale(1.08);
        }
      }
      @keyframes grid-drift {
        to {
          background-position: 34px 34px;
        }
      }
      @media (max-width: 420px) {
        .shell {
          padding-top: 38px;
        }
        .link-card {
          min-height: 76px;
          padding: 13px 15px;
          border-radius: 18px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *:before,
        *:after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="orb one"></div>
    <div class="orb two"></div>
    <main class="shell">
      <header class="profile">
        <div class="avatar-wrap">
          <div class="avatar" aria-label="Logo Web_Up">W_</div>
        </div>
        <div class="status">seus links</div>
        <h1>Web_Up<span>.</span></h1>
      </header>
      <nav class="links" aria-label="Links principais">
        <!-- EDITE: substitua os # abaixo pelos seus links reais -->
        <a class="link-card" href="#" data-label="Instagram"
          ><span class="icon"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <rect x="3" y="3" width="18" height="18" rx="5" />
              <circle cx="12" cy="12" r="4" />
              <circle
                cx="17.5"
                cy="6.5"
                r="1"
                fill="currentColor"
                stroke="none"
              /></svg></span
          ><span class="copy"
            ><strong>Instagram</strong
            ><small>Conteúdo novo por aqui</small></span
          ><span class="arrow">↗</span></a
        >
        <a class="link-card" href="#" data-label="Projetos"
          ><span class="icon"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                d="M4 5a2 2 0 0 1 2-2h4l2 3h6a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"
              />
              <path d="m9 15 6-6M10 9h5v5" /></svg></span
          ><span class="copy"
            ><strong>Meus projetos</strong
            ><small>Conheça o que estou construindo</small></span
          ><span class="arrow">↗</span></a
        >
        <a class="link-card" href="#" data-label="Contato"
          ><span class="icon"
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
            >
              <path
                d="M21 12a8.5 8.5 0 0 1-12.8 7.3L3 21l1.7-5.2A8.5 8.5 0 1 1 21 12Z"
              />
              <path
                d="M8 12h.01M12 12h.01M16 12h.01"
                stroke-width="2.5"
                stroke-linecap="round"
              /></svg></span
          ><span class="copy"
            ><strong>Fale comigo</strong
            ><small>Vamos criar algo juntos</small></span
          ><span class="arrow">↗</span></a
        >
      </nav>
    </main>
    <script>
      document.querySelectorAll(".link-card").forEach((card) => {
        card.addEventListener("pointermove", (event) => {
          const rect = card.getBoundingClientRect();
          card.style.setProperty("--x", `${event.clientX - rect.left}px`);
          card.style.setProperty("--y", `${event.clientY - rect.top}px`);
        });
        card.addEventListener("click", (event) => {
          if (card.getAttribute("href") === "#") {
            event.preventDefault();
            const copy = card.querySelector("small"),
              original = copy.textContent;
            copy.textContent = "Adicione seu link no HTML";
            setTimeout(() => (copy.textContent = original), 1800);
          }
        });
      });
    </script>
  </body>
</html>
